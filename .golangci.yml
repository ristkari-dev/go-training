version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    paths:
      - shared/reveal
    rules:
      # Teaching examples often have intentionally simple main() functions.
      - path: lessons/.*/(exercises|solutions)/
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
